name: ios-ipa

# Builds an unsigned iOS IPA for this repository (bitchat + on-device
# auto-translation). No upstream clone: the workflow builds the checked-out
# tree, so every push can produce a testable IPA.
#
# The produced IPA is unsigned: install it with a sideloading tool
# (e.g. iloader) that re-signs it for your device.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner image'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - macos-26
          - macos-latest
      label:
        description: 'artifact label suffix'
        required: false
        default: 'bitchat'
      skip_build:
        description: 'only resolve packages (fast smoke test, no IPA)'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-ios:
    name: "Build unsigned IPA"
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project bitchat.xcodeproj -scheme "bitchat (iOS)" | tail -20

      - name: Build iOS (no codesign)
        if: ${{ inputs.skip_build != 'true' }}
        run: |
          set +e
          xcodebuild \
            -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/bitchat_build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit: $STATUS"
          echo "---- errors ----"
          grep -nE "(error:|fatal error:)" /tmp/bitchat_build.log | head -40 || true
          echo "---- tail ----"
          tail -25 /tmp/bitchat_build.log
          exit $STATUS

      - name: Upload build log
        if: always() && inputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buildlog_${{ inputs.label || 'bitchat' }}
          path: /tmp/bitchat_build.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        if: ${{ inputs.skip_build != 'true' }}
        env:
          LABEL: ${{ inputs.label || 'bitchat' }}
        run: |
          set -euo pipefail
          ls -la build_dd/Build/Products/Release-iphoneos/ || true
          APP=$(find build_dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          if [ -d "Payload/$(basename "$APP")/PlugIns" ]; then
            find "Payload/$(basename "$APP")/PlugIns" -name "*.appex" -type d \
              -exec codesign --force --sign - {} \; || true
          fi
          if [ -d "Payload/$(basename "$APP")/Frameworks" ]; then
            find "Payload/$(basename "$APP")/Frameworks" -name "*.framework" -type d \
              -exec codesign --force --sign - {} \; || true
          fi
          OUT="bitchat_ios_${LABEL}_no_sign.ipa"
          zip -q -r "$OUT" Payload
          ls -lh "$OUT"
          unzip -l "$OUT" | head -15

      - name: Upload IPA
        if: ${{ inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios_outputs_${{ inputs.label || 'bitchat' }}
          path: bitchat_ios_*_no_sign.ipa
          if-no-files-found: error
